<!doctype html>
<meta charset="utf-8">
<title>Shinmomo Structural World</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{font:14px system-ui;margin:0;display:grid;grid-template-columns:320px 1fr;height:100vh}
aside{padding:12px;overflow:auto;border-right:1px solid #888}main{padding:12px;overflow:auto;min-width:0}
button{display:block;width:100%;text-align:left}.mapButton.active{font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.toolbar label{display:flex;gap:5px;align-items:center}.toolbar input[type=range]{width:140px}
#mapViewport{overflow:auto;max-height:68vh;border:1px solid #777;background:#222;min-height:240px}
#mapSizer{position:relative}.mapStage{position:absolute;left:0;top:0;transform-origin:0 0;background:#333}
#mapImage{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;image-rendering:pixelated}
#gridLayer,#hotspotLayer,#arrivalLayer,#actorLayer,#focusLayer,#dialogueLayer{position:absolute;inset:0;pointer-events:none}
#gridLayer.on{background-image:linear-gradient(to right,#ffffff33 1px,transparent 1px),linear-gradient(to bottom,#ffffff33 1px,transparent 1px)}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;padding:0;border:1px dashed #f6d365;background:#ffd54f28;box-shadow:inset 0 0 0 1px #0008}
.hotspot:hover{background:#ffd54f66;border-style:solid}.hotspot.confirmed{border:2px solid #7fffb2;background:#30d97835}
.focusMarker{position:absolute;pointer-events:none;width:24px;height:24px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #20d6ff88,0 0 14px #20d6ff;animation:focusPulse .9s ease-in-out infinite alternate}
@keyframes focusPulse{to{transform:translate(-50%,-50%) scale(1.35);opacity:.55}}
.dialogueWindow{position:absolute;pointer-events:auto;z-index:30;width:320px;max-width:42vw;transform:translate(-50%,calc(-100% - 42px));background:#07131ff2;color:#fff;border:3px solid #f5f1d8;box-shadow:0 0 0 2px #101820,inset 0 0 0 1px #8796a5,0 4px 12px #000a;border-radius:3px;padding:8px 10px;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:600;line-height:1.65}
.dialogueWindow.below{transform:translate(-50%,34px)}
.dialogueWindow::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#f5f1d8}
.dialogueWindow.below::after{top:-12px;bottom:auto;border-top-color:transparent;border-bottom-color:#f5f1d8}
.dialogueHeader{display:flex;gap:6px;align-items:center;margin-bottom:5px;font-size:11px;opacity:.9}
.dialogueHeader strong{font-size:12px;margin-right:auto}.dialogueBranch{max-width:190px;font:11px system-ui}
.dialogueText{white-space:pre-wrap;min-height:4.5em;font-size:14px;letter-spacing:.02em}
.dialogueMeta{font:10px monospace;opacity:.68;border-top:1px solid #ffffff33;margin-top:6px;padding-top:4px}
.dialogueControls{display:flex;gap:6px;margin-top:6px;align-items:center}.dialogueControls button{display:inline-block;width:auto;padding:2px 8px}.dialoguePage{margin-left:auto;font:11px monospace;opacity:.8}
.actor{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;background:transparent;padding:0;width:auto}
.actor img,.actor canvas{display:block;width:32px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 1px 1px #000)}
.actor.candidate img,.actor.candidate canvas{outline:1px dashed #ffd54f}.actor .dot{display:block;width:8px;height:8px;border-radius:50%;background:#ffd54f;border:1px solid #111}.actor.stateConditional img,.actor.stateConditional canvas{opacity:.72;outline:2px dotted #73e6ff}.actor.stateConditional .dot{background:#73e6ff}
.actorLabel,.arrivalLabel{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font:11px monospace;background:#000c;color:#fff;padding:1px 3px;border-radius:2px}
.arrival{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;width:13px;height:13px;border-radius:50%;border:2px solid #73e6ff;background:#001b24aa;padding:0}
.arrival.confirmed{width:17px;height:17px;border-width:3px;background:#73e6ff88}
.edge,.unboundRow{padding:7px;border:1px solid #888;margin:6px 0;cursor:pointer}
.edge.strong{border-style:dashed}.edge.confirmed{border-width:2px}
.edgeGo{display:inline-block;width:auto;margin-left:8px;padding:2px 6px}
#unbound{max-height:240px;overflow:auto}.muted{opacity:.72}
.notice{padding:7px;border:1px solid #b88;margin:8px 0}.analysisPanel{padding:8px;border:1px solid #667;margin:8px 0}.analysisGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:6px}.analysisCard{border:1px solid #666;padding:6px;border-radius:4px}.analysisCard strong{display:block}.analysisCard small{opacity:.72}.confidenceConfirmed{border-color:#7fb}.confidenceCandidate{border-color:#fc7}.confidenceUnresolved{border-color:#d88}pre{white-space:pre-wrap;overflow-wrap:anywhere}
.statePanel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px;margin:6px 0;border:1px solid #668;border-radius:4px}.statePanel>strong{font-size:12px}.statePanel #stateStatus{font:11px monospace;opacity:.8}.statePanel #stateReset{display:inline-block;width:auto;padding:2px 7px}.statePanel #stateControls{display:flex;flex-wrap:wrap;gap:6px;width:100%}.stateField{display:flex;gap:4px;align-items:center;font:11px monospace;border:1px solid #777;padding:2px 4px;border-radius:3px}.stateField select{font:11px monospace}.actor.stateResolved img,.actor.stateResolved canvas{outline:2px solid #7fffb2}.actor.stateResolved .dot{background:#7fffb2}
#assetStatus{font-size:12px;opacity:.85}h1,h2,h3{margin:.4em 0}
</style><aside>
  <h1>World</h1>
  <label>Assets <select id="profile"><option value="canonical">canonical / local</option><option value="public_redrawn">public redrawn</option></select></label>
  <p id="summary"></p><div id="maps"></div>
</aside>
<main>
  <h2 id="title">Select map</h2>
  <div class="toolbar">
    <label><input id="transitionsToggle" type="checkbox" checked>transitions</label>
    <label><input id="actorsToggle" type="checkbox" checked>actor sprites</label>
    <label>scene pack <select id="scenePack"><option value="">auto / unresolved</option></select></label>
    <label><input id="arrivalsToggle" type="checkbox">arrival points</label>
    <label><input id="labelsToggle" type="checkbox">labels</label>
    <label><input id="gridToggle" type="checkbox">map grid</label>
    <label>zoom <input id="zoom" type="range" min="0.25" max="2" step="0.05" value="0.75"><span id="zoomValue">75%</span></label>
  </div>
  <div id="statePanel" class="statePanel">
    <strong>scene state (raw)</strong>
    <span id="stateStatus">scene譛ｪ驕ｸ謚・/span>
    <button id="stateReset" type="button" disabled>reset</button>
    <div id="stateControls"></div>
  </div>
  <div id="assetStatus"></div>
  <div id="mapViewport"><div id="mapSizer"><div id="mapStage" class="mapStage"><img id="mapImage"><div id="gridLayer"></div><div id="hotspotLayer"></div><div id="arrivalLayer"></div><div id="focusLayer"></div><div id="actorLayer"></div><div id="dialogueLayer"></div></div></div></div>
  <div id="positionNotice" class="notice"></div><section id="analysisPanel" class="analysisPanel"><h3>Analysis evidence</h3><div id="analysisSummary" class="analysisGrid"></div><details><summary>Evidence / unresolved details</summary><pre id="analysisDetail"></pre></details></section>
  <h3>Transitions</h3><div id="edges"></div>
  <details open><summary>Unbound transitions <span id="unboundCount"></span></summary><div id="unbound"></div></details>
  <h3>Selection / structure</h3><pre id="detail"></pre>
</main>
<script type="module" src="viewer.js"></script>
