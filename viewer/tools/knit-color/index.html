<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>編み図カラーマッパー A-H</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f5f3;
  --panel:#ffffff;
  --ink:#202020;
  --muted:#6c6c68;
  --line:#deded8;
  --accent:#252525;
  --shadow:0 10px 28px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--ink);
}
button,input{font:inherit}
.app{
  max-width:1500px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 390px;
  gap:18px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}
.main{
  padding:14px;
  min-width:0;
}
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:10px;
}
button,.fileButton{
  border:1px solid #cfcfca;
  background:#fff;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
}
button:hover,.fileButton:hover{background:#f3f3ef}
button.primary{
  background:#242424;
  color:#fff;
  border-color:#242424;
}
button.primary:hover{background:#000}
.canvasWrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  min-height:320px;
  display:grid;
  place-items:center;
}
#chart{
  width:100%;
  height:auto;
  display:block;
  image-rendering:auto;
}
.sidebar{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.section{
  padding:16px;
}
h1{
  margin:0 0 4px;
  font-size:20px;
}
h2{
  margin:0 0 10px;
  font-size:15px;
}
.help{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.paletteGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.colorRow{
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  display:grid;
  grid-template-columns:34px 42px 1fr;
  gap:8px;
  align-items:center;
  cursor:pointer;
}
.colorRow.active{
  outline:2px solid #222;
  outline-offset:1px;
}
.symbol{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:9px;
  font-weight:800;
  background:#f0f0ec;
}
input[type=color]{
  width:42px;height:34px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}
.hex{
  width:100%;
  min-width:0;
  border:1px solid #d7d7d2;
  border-radius:8px;
  padding:7px 8px;
  text-transform:uppercase;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.sampleBox{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:8px 0 10px;
}
.status{
  font-size:13px;
  padding:7px 9px;
  border-radius:999px;
  background:#f0f0ec;
}
#photoCanvas{
  width:100%;
  height:auto;
  max-height:430px;
  object-fit:contain;
  display:block;
  border:1px solid var(--line);
  border-radius:12px;
  background:
    linear-gradient(45deg,#eee 25%,transparent 25%) 0 0/16px 16px,
    linear-gradient(45deg,transparent 75%,#eee 75%) 0 0/16px 16px,
    linear-gradient(45deg,transparent 75%,#eee 75%) 8px -8px/16px 16px,
    linear-gradient(45deg,#eee 25%,#fff 25%) 8px -8px/16px 16px;
  cursor:crosshair;
}
#photoCanvas.empty{
  min-height:180px;
  cursor:default;
}
.samplePreview{
  width:34px;height:34px;
  border-radius:9px;
  border:1px solid #aaa;
  background:#fff;
}
.swatches{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}
.swatchItem{
  display:grid;
  grid-template-columns:30px minmax(0,1fr) 42px;
  gap:5px;
  align-items:center;
  min-width:0;
}
.swatch{
  width:30px;height:30px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,.18);
  padding:0;
}
.swatchCode{
  width:100%;
  min-width:0;
  height:30px;
  border:1px solid #d7d7d2;
  border-radius:7px;
  padding:5px 6px;
  background:#fff;
  color:#333;
  font-size:10px;
  line-height:1;
  text-transform:uppercase;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.swatchCopy{
  height:30px;
  padding:4px 5px;
  border-radius:7px;
  font-size:10px;
}
.smallActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.sep{height:1px;background:var(--line);margin:12px 0}
label.check{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:13px;
}
.note{
  background:#fafaf7;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  font-size:12px;
  line-height:1.6;
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{order:-1}
}
@media (max-width:560px){
  .app{padding:10px;gap:10px}
  .paletteGrid{grid-template-columns:1fr}
  .swatches{grid-template-columns:1fr}
  .swatchCode{font-size:12px}
  .section{padding:12px}
  .main{padding:8px}
}
</style>

<style id="privateGateStyle">
#privateGate{position:fixed;inset:0;z-index:2147483647;background:#f5f5f3;display:grid;place-items:center;padding:20px}
#privateGate .gateCard{width:min(92vw,360px);background:#fff;border:1px solid #deded8;border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.12);padding:22px}
#privateGate h2{margin:0 0 6px;font-size:20px}
#privateGate p{margin:0 0 14px;color:#6c6c68;font-size:13px}
#privateGate input{width:100%;border:1px solid #cfcfca;border-radius:10px;padding:11px 12px;font:inherit;margin:0 0 10px}
#privateGate button{width:100%;border:0;border-radius:10px;padding:11px 12px;background:#242424;color:#fff;font:inherit;cursor:pointer}
#privateGate .gateError{min-height:20px;margin-top:9px;color:#a22;font-size:12px}
</style>
</head>
<body>

<div id="privateGate" aria-modal="true" role="dialog">
  <form class="gateCard" id="privateGateForm">
    <h2>Private tool</h2>
    <p>パスワードを入力してください。</p>
    <input id="privateGatePassword" type="password" autocomplete="current-password" autofocus>
    <button type="submit">開く</button>
    <div class="gateError" id="privateGateError"></div>
  </form>
</div>
<div class="app">
  <main class="card main">
    <div class="toolbar">
      <button id="exportBtn" class="primary">PNGを書き出す</button>
      <button id="resetBtn">初期色に戻す</button>
      <button id="savePaletteBtn">配色JSONを保存</button>
      <label class="fileButton">
        配色JSONを読込
        <input id="paletteFile" type="file" accept=".json,application/json" hidden>
      </label>
    </div>
    <div class="canvasWrap">
      <canvas id="chart" width="750" height="553"></canvas>
    </div>
  </main>

  <aside class="sidebar">
    <section class="card section">
      <h1>編み図カラーマッパー</h1>
      <p class="help">A〜Hごとに色を変えます。元画像の線と英字をそのまま使うので、記号の位置は動きません。</p>
    </section>

    <section class="card section">
      <h2>記号ごとの色</h2>
      <div id="paletteGrid" class="paletteGrid"></div>
      <div class="sep"></div>
      <div class="swatches" id="presetSwatches" aria-label="カラーパレット"></div>
      <p class="help">行を選んでから色見本を押すか、カラーピッカー／HEXを直接編集できます。色見本のカラーコードは選択・コピーできます。</p>
    </section>

    <section class="card section">
      <h2>写真からスポイト</h2>
      <div class="smallActions">
        <label class="fileButton">
          写真を1枚読む
          <input id="photoFile" type="file" accept="image/*" hidden>
        </label>
        <button id="startSequenceBtn">A→H 連続採取</button>
      </div>
      <div class="sampleBox">
        <span class="status" id="sampleStatus">対象: A</span>
        <span class="samplePreview" id="samplePreview"></span>
        <code id="sampleHex">#FFFFFF</code>
      </div>
      <label class="check">
        <input id="autoAdvance" type="checkbox" checked>
        1色拾うごとに A→B→…→H と自動で次へ
      </label>
      <div style="height:10px"></div>
      <canvas id="photoCanvas" class="empty" width="640" height="360"></canvas>
      <p class="help">写真上をクリック／タップすると、その画素の色を現在の記号へ設定します。連続採取なら8回でA〜Hが揃います。</p>
    </section>

    <section class="card section">
      <h2>補足</h2>
      <div class="note">
        色だけを図の面へ重ね、元の黒線・英字は原画像から保持しています。PNG書き出しも現在の配色をそのまま保存します。
      </div>
    </section>
  </aside>
</div>

function hexToRgb(hex){
  const h = hex.replace("#","").trim();
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return {
    r:parseInt(h.slice(0,2),16),
    g:parseInt(h.slice(2,4),16),
    b:parseInt(h.slice(4,6),16)
  };
}
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("").toUpperCase();
}
function normalizeHex(v){
  let s=v.trim();
  if(!s.startsWith("#")) s="#"+s;
  if(/^#[0-9a-fA-F]{6}$/.test(s)) return s.toUpperCase();
  return null;
}
function setActive(letter){
  activeLetter = letter;
  document.querySelectorAll(".colorRow").forEach(el=>el.classList.toggle("active", el.dataset.letter===letter));
  document.getElementById("sampleStatus").textContent = `対象: ${letter}`;
}
function setColor(letter, hex){
  const normalized = normalizeHex(hex);
  if(!normalized) return false;
  colors[letter] = normalized;
  const row = document.querySelector(`.colorRow[data-letter="${letter}"]`);
  if(row){
    row.querySelector('input[type="color"]').value = normalized;
    row.querySelector(".hex").value = normalized;
    row.querySelector(".symbol").style.background = normalized;
    row.querySelector(".symbol").style.color = contrastText(normalized);
  }
  renderChart();
  return true;
}
function contrastText(hex){
  const c=hexToRgb(hex);
  const lum=(0.299*c.r+0.587*c.g+0.114*c.b);
  return lum>160 ? "#111" : "#fff";
}

function buildPaletteUI(){
  const grid = document.getElementById("paletteGrid");
  grid.innerHTML="";
  letters.forEach(letter=>{
    const row=document.createElement("div");
    row.className="colorRow";
    row.dataset.letter=letter;
    row.innerHTML=`
      <div class="symbol">${letter}</div>
      <input type="color" value="${colors[letter]}" aria-label="${letter} の色">
      <input class="hex" value="${colors[letter]}" maxlength="7" aria-label="${letter} HEX">
    `;
    row.addEventListener("click", ()=>setActive(letter));
    const cp=row.querySelector('input[type="color"]');
    const hex=row.querySelector(".hex");
    cp.addEventListener("input", e=>{
      setActive(letter);
      setColor(letter,e.target.value);
    });
    hex.addEventListener("change", e=>{
      setActive(letter);
      if(!setColor(letter,e.target.value)) e.target.value=colors[letter];
    });
    hex.addEventListener("keydown", e=>{
      if(e.key==="Enter"){ e.target.blur(); }
    });
    grid.appendChild(row);
    setColor(letter, colors[letter]);
  });
  setActive(activeLetter);
}

function buildPresetSwatches(){
  const presets=[
    "#FFFFFF","#F2E9DC","#D9C1A5","#B79375","#7A5A49","#4B3329",
    "#BFE8E7","#77CED2","#43AEB5","#F5B49A","#DC845E","#B75A37",
    "#F3D6DF","#C88FB0","#92A9C7","#A6B78D"
  ];
  const box=document.getElementById("presetSwatches");
  box.innerHTML="";
  presets.forEach(hex=>{
    const item=document.createElement("div");
    item.className="swatchItem";

    const b=document.createElement("button");
    b.type="button";
    b.className="swatch";
    b.style.background=hex;
    b.title=hex+" を現在の記号へ設定";
    b.setAttribute("aria-label",hex+" を現在の記号へ設定");
    b.addEventListener("click",()=>setColor(activeLetter,hex));

    const code=document.createElement("input");
    code.className="swatchCode";
    code.value=hex;
    code.readOnly=true;
    code.setAttribute("aria-label",hex+" カラーコード");
    code.addEventListener("focus",()=>code.select());
    code.addEventListener("click",()=>code.select());

    const copy=document.createElement("button");
    copy.type="button";
    copy.className="swatchCopy";
    copy.textContent="コピー";
    copy.title=hex+" をコピー";
    copy.addEventListener("click",async()=>{
      let copied=false;
      try{
        await navigator.clipboard.writeText(hex);
        copied=true;
      }catch(_err){
        code.focus();
        code.select();
        try{ copied=document.execCommand("copy"); }catch(_ignored){}
      }
      if(copied){
        const old=copy.textContent;
        copy.textContent="済";
        setTimeout(()=>{ copy.textContent=old; },900);
      }
    });

    item.append(b,code,copy);
    box.appendChild(item);
  });
}

async function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}


function repairMaskImageData(baseData, maskData){
  const w=baseData.width, h=baseData.height, n=w*h;
  const orig=new Uint8Array(n);
  const gray=new Uint8Array(n);
  let minX=w, minY=h, maxX=0, maxY=0;
  for(let i=0;i<n;i++){
    const p=i*4;
    const cls=maskData.data[p];
    orig[i]=cls;
    const r=baseData.data[p], g=baseData.data[p+1], b=baseData.data[p+2];
    gray[i]=Math.round(0.299*r + 0.587*g + 0.114*b);
    if(cls>0){
      const x=i%w, y=(i/w)|0;
      if(x<minX) minX=x; if(x>maxX) maxX=x;
      if(y<minY) minY=y; if(y>maxY) maxY=y;
    }
  }

  function forNeighbors(i, fn){
    const x=i%w, y=(i/w)|0;
    for(let dy=-1;dy<=1;dy++){
      for(let dx=-1;dx<=1;dx++){
        if(dx===0 && dy===0) continue;
        const nx=x+dx, ny=y+dy;
        if(nx>=0 && nx<w && ny>=0 && ny<h) fn(ny*w+nx);
      }
    }
  }

  function nearestClass(seed){
    const cls=new Uint8Array(seed);
    const seen=new Uint8Array(n);
    const q=new Int32Array(n);
    let head=0, tail=0;
    for(let i=0;i<n;i++){
      if(cls[i]>0){ seen[i]=1; q[tail++]=i; }
    }
    while(head<tail){
      const i=q[head++];
      forNeighbors(i,j=>{
        if(!seen[j]){
          seen[j]=1;
          cls[j]=cls[i];
          q[tail++]=j;
        }
      });
    }
    return cls;
  }

  // Repair two mask defects without touching the original symbol positions:
  // 1) tiny A/B cells lost fill around their glyphs
  // 2) the lower-right E cell had been joined to F
  const nearOrig=nearestClass(orig);
  const seedMap=new Uint8Array(orig);
  const visited=new Uint8Array(n);
  const q=new Int32Array(n);
  const eSeedX=Math.round(w*565/750), eSeedY=Math.round(h*470/553);
  const eSeed=eSeedY*w+eSeedX;

  for(let start=0;start<n;start++){
    if(visited[start] || gray[start]<245) continue;
    let head=0, tail=0, touchesBorder=false, containsE=false;
    const own=new Uint32Array(9), near=new Uint32Array(9);
    q[tail++]=start; visited[start]=1;
    while(head<tail){
      const i=q[head++];
      const x=i%w, y=(i/w)|0;
      if(x===0 || x===w-1 || y===0 || y===h-1) touchesBorder=true;
      if(i===eSeed) containsE=true;
      const a=orig[i]; if(a>=1 && a<=8) own[a]++;
      const b=nearOrig[i]; if(b>=1 && b<=8) near[b]++;
      forNeighbors(i,j=>{
        if(!visited[j] && gray[j]>=245){
          visited[j]=1;
          q[tail++]=j;
        }
      });
    }
    if(touchesBorder) continue;
    let cls=0, best=-1, ownTotal=0;
    for(let c=1;c<=8;c++) ownTotal+=own[c];
    const src=ownTotal>0 ? own : near;
    for(let c=1;c<=8;c++){
      if(src[c]>best){ best=src[c]; cls=c; }
    }
    if(containsE) cls=5;
    if(cls>0){
      for(let k=0;k<tail;k++) seedMap[q[k]]=cls;
    }
  }

  // Flood only the true exterior from the untouched line art. This lets color
  // reach behind letters and antialiasing while keeping the outside pure white.
  const exterior=new Uint8Array(n);
  let head=0, tail=0;
  const pushExterior=(i)=>{
    if(!exterior[i] && gray[i]>=200){ exterior[i]=1; q[tail++]=i; }
  };
  for(let x=0;x<w;x++){ pushExterior(x); pushExterior((h-1)*w+x); }
  for(let y=0;y<h;y++){ pushExterior(y*w); pushExterior(y*w+w-1); }
  while(head<tail){
    const i=q[head++];
    forNeighbors(i,j=>{
      if(!exterior[j] && gray[j]>=200){
        exterior[j]=1;
        q[tail++]=j;
      }
    });
  }

  const nearest=nearestClass(seedMap);
  const fixed=new Uint8ClampedArray(maskData.data.length);
  const pad=3;
  minX=Math.max(0,minX-pad); maxX=Math.min(w-1,maxX+pad);
  minY=Math.max(0,minY-pad); maxY=Math.min(h-1,maxY+pad);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x, p=i*4;
      if(x>=minX && x<=maxX && y>=minY && y<=maxY && !exterior[i]){
        fixed[p]=nearest[i];
      }
      fixed[p+3]=255;
    }
  }
  return new ImageData(fixed,w,h);
}

async function init(){
  buildPaletteUI();
  buildPresetSwatches();

  const [baseImg, maskImg] = await Promise.all([loadImage(BASE_SRC), loadImage(MASK_SRC)]);

  ctx.clearRect(0,0,chart.width,chart.height);
  ctx.drawImage(baseImg,0,0,chart.width,chart.height);
  baseImageData = ctx.getImageData(0,0,chart.width,chart.height);

  maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
  maskCtx.imageSmoothingEnabled=false;
  maskCtx.drawImage(maskImg,0,0,maskCanvas.width,maskCanvas.height);
  maskImageData = maskCtx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
  maskImageData = repairMaskImageData(baseImageData, maskImageData);

  renderChart();
  drawPhotoPlaceholder();
}

function renderChart(){
  if(!baseImageData || !maskImageData) return;
  const out = new ImageData(new Uint8ClampedArray(baseImageData.data), chart.width, chart.height);
  const od=out.data, bd=baseImageData.data, md=maskImageData.data;
  const rgb=letters.map(l=>hexToRgb(colors[l]));
  for(let i=0,p=0; i<od.length; i+=4,p++){
    const cls=md[i]; // 1..8
    if(cls>=1 && cls<=8){
      const c=rgb[cls-1];
      // 元画像の明暗を掛け合わせ、黒線・文字・アンチエイリアスを保持
      od[i]   = Math.round(c.r * bd[i]   / 255);
      od[i+1] = Math.round(c.g * bd[i+1] / 255);
      od[i+2] = Math.round(c.b * bd[i+2] / 255);
      od[i+3] = 255;
    }
  }
  ctx.putImageData(out,0,0);
}

function downloadBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

document.getElementById("exportBtn").addEventListener("click",()=>{
  chart.toBlob(blob=>downloadBlob(blob,"編み図_配色.png"),"image/png");
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  colors={...defaultColors};
  letters.forEach(l=>setColor(l,colors[l]));
  setActive("A");
});
document.getElementById("savePaletteBtn").addEventListener("click",()=>{
  const data={
    format:"knit-chart-palette-v1",
    colors,
    savedAt:new Date().toISOString()
  };
  downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),"編み図_配色.json");
});
document.getElementById("paletteFile").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(!file) return;
  try{
    const obj=JSON.parse(await file.text());
    const src=obj.colors||obj;
    letters.forEach(l=>{
      if(src[l] && normalizeHex(src[l])) setColor(l,src[l]);
    });
  }catch(err){
    alert("配色JSONを読み込めませんでした。");
  }finally{
    e.target.value="";
  }
});

const photoCanvas=document.getElementById("photoCanvas");
const pctx=photoCanvas.getContext("2d",{willReadFrequently:true});

function drawPhotoPlaceholder(){
  photoCanvas.classList.add("empty");
  pctx.clearRect(0,0,photoCanvas.width,photoCanvas.height);
  pctx.fillStyle="#f7f7f4";
  pctx.fillRect(0,0,photoCanvas.width,photoCanvas.height);
  pctx.fillStyle="#777";
  pctx.font="16px -apple-system,BlinkMacSystemFont,sans-serif";
  pctx.textAlign="center";
  pctx.fillText("ここに毛糸の写真を読み込みます",photoCanvas.width/2,photoCanvas.height/2-4);
  pctx.font="12px -apple-system,BlinkMacSystemFont,sans-serif";
  pctx.fillText("クリック／タップでスポイト",photoCanvas.width/2,photoCanvas.height/2+22);
  photoImageData=null;
  photoScaleInfo=null;
}

document.getElementById("photoFile").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(!file) return;
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImage(url);
    const maxW=900, maxH=700;
    const s=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);
    const w=Math.max(1,Math.round(img.naturalWidth*s));
    const h=Math.max(1,Math.round(img.naturalHeight*s));
    photoCanvas.width=w;
    photoCanvas.height=h;
    pctx.clearRect(0,0,w,h);
    pctx.imageSmoothingEnabled=true;
    pctx.drawImage(img,0,0,w,h);
    photoCanvas.classList.remove("empty");
    photoImageData=pctx.getImageData(0,0,w,h);
    photoScaleInfo={w,h};
  }finally{
    URL.revokeObjectURL(url);
    e.target.value="";
  }
});

photoCanvas.addEventListener("pointerdown",e=>{
  if(!photoImageData || !photoScaleInfo) return;
  const rect=photoCanvas.getBoundingClientRect();
  const x=Math.max(0,Math.min(photoCanvas.width-1,Math.floor((e.clientX-rect.left)*photoCanvas.width/rect.width)));
  const y=Math.max(0,Math.min(photoCanvas.height-1,Math.floor((e.clientY-rect.top)*photoCanvas.height/rect.height)));
  const i=(y*photoCanvas.width+x)*4;
  const r=photoImageData.data[i], g=photoImageData.data[i+1], b=photoImageData.data[i+2];
  const hex=rgbToHex(r,g,b);
  document.getElementById("samplePreview").style.background=hex;
  document.getElementById("sampleHex").textContent=hex;
  setColor(activeLetter,hex);

  if(document.getElementById("autoAdvance").checked){
    const idx=letters.indexOf(activeLetter);
    if(idx<letters.length-1) setActive(letters[idx+1]);
  }
});

document.getElementById("startSequenceBtn").addEventListener("click",()=>{
  setActive("A");
  document.getElementById("autoAdvance").checked=true;
});

init().catch(err=>{
  console.error(err);
  alert("初期化に失敗しました。HTMLファイルを再度開いてください。");
});
</script>

<script id="privateGateScript">
(() => {
  const TARGET = "641a5bfc34ffe6806b93a7c94e2ddf8244e341d776a26fbfba1bbb19de4d5b6e";
  const KEY = "knit_color_private_unlocked_v1";
  const gate = document.getElementById("privateGate");
  const form = document.getElementById("privateGateForm");
  const input = document.getElementById("privateGatePassword");
  const error = document.getElementById("privateGateError");
  const hide = () => { gate.style.display = "none"; };
  if (sessionStorage.getItem(KEY) === "1") hide();
  async function digest(s) {
    const bytes = new TextEncoder().encode(s);
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2,"0")).join("");
  }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.textContent = "";
    const d = await digest(input.value);
    if (d === TARGET) {
      sessionStorage.setItem(KEY, "1");
      input.value = "";
      hide();
    } else {
      error.textContent = "パスワードが違います。";
      input.select();
    }
  });
})();
</script>
