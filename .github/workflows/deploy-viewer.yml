name: Deploy map viewer to Mole Mall

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'tools/python/build_structural_world_viewer.py'
      - 'tools/python/build_native_saved_return_context.py'
      - 'tools/python/crosslink_transition_sources_from_hotspots.py'
      - 'tools/python/crosslink_destination_bounds_for_viewer.py'
      - 'scripts/prepare_public_viewer.py'
      - 'data/maps/**'
      - 'data/npc_display/**'
      - 'graphics/static_character_reconstruction/**'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shinmomo-viewer-deploy
  cancel-in-progress: true

jobs:
  build-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild structural viewer data
        run: python tools/python/build_structural_world_viewer.py
      - name: Build public viewer bundle
        run: python scripts/prepare_public_viewer.py
      - name: Validate viewer
        run: |
          VIEWER_JS=$(python -c "import json; print(json.load(open('dist/viewer-site/bundle-manifest.json'))['viewer_script'])")
          cp "dist/viewer-site/$VIEWER_JS" /tmp/viewer.mjs
          node --check /tmp/viewer.mjs
          test -s dist/viewer-site/index.html
          test -s dist/viewer-site/data/world.json
          test -s dist/viewer-site/bundle-manifest.json
      - name: Add deployment metadata
        run: |
          printf '{"source_commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/viewer-site/deploy-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: shinmomo-map-viewer
          path: dist/viewer-site
