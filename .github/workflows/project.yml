name: Project CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      python-version: '3.11'
      build-command: python -m compileall -q tools scripts
      test-command: python scripts/ci_validate.py && python scripts/test_transition_source_bindings.py && python scripts/test_destination_bounds_overlay.py && python scripts/test_native_saved_return_context.py && python scripts/test_world_graph_coverage.py && python scripts/test_transition_spatial_phase_gates.py && python scripts/test_vm56_source_ownership.py && python scripts/test_vm56_entry_cfg.py && python scripts/test_vm_opcode6e_handler.py && python scripts/test_vm_opcode02_13_handler.py
      package-command: python scripts/build_info.py && python scripts/package.py
      artifact-directory: dist
