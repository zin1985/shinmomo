name: Project CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      python-version: '3.11'
      build-command: python -m compileall -q tools scripts
      test-command: python scripts/ci_validate.py && python scripts/test_transition_source_bindings.py && python scripts/test_destination_bounds_overlay.py && python scripts/test_native_saved_return_context.py && python scripts/test_world_graph_coverage.py && python scripts/test_transition_spatial_phase_gates.py && python scripts/test_vm56_source_ownership.py && python scripts/test_vm56_entry_cfg.py && python scripts/test_vm_opcode6e_handler.py && python scripts/test_vm_opcode02_13_handler.py && python scripts/test_vm_opcode39_40_handlers.py && python scripts/test_vm_opcode25_deferred.py && python scripts/test_vm_execution_trace_audit.py && python scripts/test_native_south_exit_replay.py && python scripts/test_tabidachi_world_roundtrip.py && python scripts/test_vm_frame_series_audit.py && python scripts/test_vm_frame_series_replays.py && python scripts/test_transition_phases.py && python scripts/test_spatial_event_transition_proofs.py && python scripts/test_native_pack4d_world_return.py && python scripts/test_pack4d_location_and_dungeon_targets.py && python scripts/test_cheat_warp_dungeon_entry.py && python scripts/test_pack91_world_return.py && python scripts/test_omusubi_hole_to_pack95.py && python scripts/test_pack95_reverse_stair.py && python scripts/test_world_37_scene_batch.py && python scripts/test_scene_14_world_returns.py
      package-command: python scripts/build_info.py && python scripts/package.py
      artifact-directory: dist
